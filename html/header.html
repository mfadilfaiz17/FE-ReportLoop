<header class="app-header sticky top-0 z-30 safe-top">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between xl:grid xl:grid-cols-[1fr_auto_1fr] gap-2 lg:gap-4 py-2 sm:py-3">

      <!-- Baris atas: Brand & Kontrol Ringkas Mobile -->
      <div class="flex items-center justify-between gap-2 min-w-0">
        <a href="../index.html" class="flex items-center gap-2 sm:gap-2.5 focus-visible:outline-white rounded-lg min-w-0">
          <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-white/15 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 sm:w-5 sm:h-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
            </svg>
          </span>
          <div class="min-w-0">
            <p class="text-base sm:text-lg font-extrabold tracking-tight leading-none">ReportLoop</p>
            <p id="role-label" class="mt-0.5 sm:mt-1 text-[11px] sm:text-xs text-blue-100 truncate">Politeknik Negeri Indramayu</p>
          </div>
        </a>

        <div class="flex items-center gap-1 sm:gap-1.5 lg:hidden shrink-0">
          <button
            type="button"
            data-nav-view="profil"
            aria-label="Buka profil akun"
            class="nav-link border border-white/35 px-2"
          >
            <svg class="w-4 h-4 shrink-0" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            <span id="session-name-mobile" class="hidden sm:inline max-w-[76px] truncate text-xs font-semibold">Profil</span>
          </button>

          <button type="button" data-theme-toggle aria-pressed="false" aria-label="Beralih ke mode gelap" class="nav-link border border-white/35 px-2">
            <span data-theme-icon></span>
          </button>

          <button id="btn-logout-mobile" type="button" data-logout-trigger aria-label="Keluar akun" class="nav-link border border-white/35 px-2.5 text-xs">
            Keluar
          </button>
        </div>
      </div>

      <!-- Menu Navigasi Halaman + Kontrol Sekunder Desktop -->
      <div class="flex items-center justify-between gap-2 min-w-0 border-t border-white/15 pt-1.5 lg:border-0 lg:pt-0 lg:flex-1 xl:contents">
        <nav aria-label="Navigasi utama" class="-mx-1 flex-1 min-w-0 overflow-x-auto no-scrollbar lg:mx-0 lg:overflow-visible xl:flex-none">
          <ul id="app-nav" class="flex items-center justify-center gap-1 sm:gap-1.5 px-1 w-max min-w-full"></ul>
        </nav>

        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 xl:justify-self-end">
          <button
            id="btn-api-mode"
            type="button"
            aria-describedby="api-mode-hint"
            class="nav-link border border-white/35 px-2.5 sm:px-3.5 text-xs sm:text-sm"
          >
            <span id="api-dot" aria-hidden="true" class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-amber-300 shrink-0"></span>
            <span id="api-mode-label" class="whitespace-nowrap">Mode demo</span>
          </button>
          <span id="api-mode-hint" class="sr-only">Tekan untuk beralih antara data demo di browser dan server FastAPI lokal.</span>

          <button type="button" data-theme-toggle aria-pressed="false" aria-label="Beralih ke mode gelap" class="hidden lg:inline-flex nav-link border border-white/35">
            <span data-theme-icon></span>
            <span data-theme-label class="hidden xl:inline">Gelap</span>
          </button>

          <button
            type="button"
            data-nav-view="profil"
            class="hidden lg:inline-flex nav-link border border-white/35"
            aria-label="Buka halaman profil akun"
            title="Buka halaman profil akun"
          >
            <span id="session-avatar" class="w-6 h-6 rounded-full bg-white/20 text-xs font-extrabold flex items-center justify-center uppercase">U</span>
            <span id="session-name" class="hidden xl:inline max-w-[140px] truncate">-</span>
          </button>

          <button id="btn-logout" type="button" data-logout-trigger class="hidden lg:inline-flex nav-link border border-white/35">Keluar</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="toast-container" role="status" aria-live="polite" class="fixed bottom-4 left-3 right-3 sm:left-auto sm:bottom-5 sm:right-5 z-50 flex flex-col gap-2 sm:max-w-sm sm:w-full pointer-events-none safe-bottom"></div>
