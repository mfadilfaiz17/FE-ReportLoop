<header class="app-header sticky top-0 z-30 safe-top">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5 lg:gap-4 py-3">

      <!-- Baris atas: Brand & Kontrol Mobile -->
      <div class="flex items-center justify-between gap-2">
        <a href="../index.html" class="flex items-center gap-2.5 focus-visible:outline-white rounded-lg min-w-0">
          <span class="w-9 h-9 rounded-lg bg-white/15 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
            </svg>
          </span>
          <div class="min-w-0">
            <p class="text-lg font-extrabold tracking-tight leading-none">ReportLoop</p>
            <p id="role-label" class="mt-1 text-xs text-blue-100 truncate">Politeknik Negeri Indramayu</p>
          </div>
        </a>

        <div class="flex items-center gap-1.5 lg:hidden shrink-0">
          <button
            type="button"
            data-nav-view="profil"
            aria-label="Buka profil akun"
            class="nav-link border border-white/35 px-2.5"
          >
            <svg class="w-4 h-4 shrink-0" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            <span id="session-name-mobile" class="max-w-[84px] truncate text-xs font-semibold">Profil</span>
          </button>

          <button type="button" data-theme-toggle aria-pressed="false" aria-label="Beralih ke mode gelap" class="nav-link border border-white/35 px-2.5">
            <span data-theme-icon></span>
          </button>
        </div>
      </div>

      <!-- Menu Navigasi Halaman (Peta & Lapor, Papan Laporan, Profil) -->
      <nav aria-label="Navigasi utama" class="-mx-1 overflow-x-auto no-scrollbar">
        <ul id="app-nav" class="flex items-center gap-1.5 px-1 w-max"></ul>
      </nav>

      <!-- Kontrol Sekunder & Profil Desktop -->
      <div class="flex flex-wrap items-center justify-between lg:justify-end gap-2">
        <button
          id="btn-api-mode"
          type="button"
          aria-describedby="api-mode-hint"
          class="nav-link border border-white/35"
        >
          <span id="api-dot" aria-hidden="true" class="w-2.5 h-2.5 rounded-full bg-amber-300"></span>
          <span id="api-mode-label">Mode demo</span>
        </button>
        <span id="api-mode-hint" class="sr-only">Tekan untuk beralih antara data demo di browser dan server FastAPI lokal.</span>

        <button type="button" data-theme-toggle aria-pressed="false" aria-label="Beralih ke mode gelap" class="hidden lg:inline-flex nav-link border border-white/35">
          <span data-theme-icon></span>
          <span data-theme-label>Gelap</span>
        </button>

        <button
          type="button"
          data-nav-view="profil"
          class="hidden lg:inline-flex nav-link border border-white/35"
          title="Buka halaman profil akun"
        >
          <span id="session-avatar" class="w-6 h-6 rounded-full bg-white/20 text-xs font-extrabold flex items-center justify-center uppercase">U</span>
          <span id="session-name" class="max-w-[140px] truncate">-</span>
        </button>

        <button id="btn-logout" type="button" class="nav-link border border-white/35">Keluar</button>
      </div>
    </div>
  </div>
</header>

<div id="toast-container" role="status" aria-live="polite" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0 safe-bottom"></div>
